server:
port: ${PORT:8080}
forward-headers-strategy: framework

spring:
datasource:
url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devconnect?sslmode=disable}
username: ${SPRING_DATASOURCE_USERNAME:postgres}
password: ${SPRING_DATASOURCE_PASSWORD:postgres}

jpa:
open-in-view: false

```
hibernate:
  ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

show-sql: false

properties:
  hibernate:
    format_sql: true

    jdbc:
      lob:
        non_contextual_creation: true
```

jackson:
serialization:
write-dates-as-timestamps: false

app:
cors:
allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:[http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app}](http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app})

jwt:
secret: ${JWT_SECRET:VGhpc0lzQVNlY3VyZTMyeUJ5dGVCYXNlNjRLZXlGb3JKV1QxMjM0NQ==}
expiration: ${JWT_EXPIRATION:86400000}
